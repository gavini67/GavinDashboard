<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Gavin's Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #050506;
  --bg-card: rgba(255,255,255,0.04);
  --accent: #1D9E75;
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --text-quaternary: #4D4B47;
  --success: #6BE3A4;
  --warning: #F2C063;
  --danger: #FF6B6B;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}

/* drifting glow */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(107,227,164,0.10), transparent 45%),
    radial-gradient(circle at 80% 75%, rgba(125,211,252,0.08), transparent 50%),
    radial-gradient(circle at 55% 50%, rgba(242,192,99,0.06), transparent 45%);
  filter: blur(40px);
  pointer-events: none;
  z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
/* dot texture */
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page {
  max-width: 900px;
  margin: 0 auto;
}

/* page title */
.dash-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  margin-bottom: 24px;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

/* ===== BENTO GRID ===== */
.bento {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 168px;
  grid-auto-flow: dense;
  gap: 14px;
}

/* tile base */
.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 18px 20px 16px;
  border-radius: 18px;
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.07);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  text-decoration: none;
  color: inherit;
  overflow: hidden;
  transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}
.tile::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 60%);
  pointer-events: none;
}
.tile:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--accent, #6BE3A4) 40%, transparent);
  box-shadow:
    0 8px 32px rgba(0,0,0,0.35),
    0 0 0 1px color-mix(in srgb, var(--accent, #6BE3A4) 20%, transparent);
}
.tile:hover .tile-arrow {
  transform: translateX(4px);
}

/* size modifiers */
.tile.big  { grid-column: span 2; grid-row: span 2; }
.tile.wide { grid-column: span 2; }

/* tile inner elements */
.tile-num {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--text-quaternary);
  line-height: 1;
}
.tile-emoji {
  position: absolute;
  top: 16px;
  right: 18px;
  font-size: 22px;
  filter: drop-shadow(0 0 8px var(--accent, #6BE3A4));
  line-height: 1;
}
.tile.big .tile-emoji {
  font-size: 32px;
  top: 20px;
  right: 22px;
}
.tile-spacer { flex: 1; }
.tile-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  line-height: 1.2;
  margin-bottom: 6px;
}
.tile.big .tile-title { font-size: 20px; }
.tile-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tile-sub {
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 400;
}
.tile.big .tile-sub { font-size: 12px; }
.tile-arrow {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent, #6BE3A4);
  transition: transform 0.18s ease;
  line-height: 1;
}
.tile.big .tile-arrow { font-size: 16px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 720px) {
  .bento {
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 148px;
  }
  .tile.big { grid-row: span 1; }
}
@media (max-width: 440px) {
  .bento {
    grid-template-columns: 1fr;
    grid-auto-rows: 132px;
  }
  .tile.big, .tile.wide { grid-column: span 1; }
}
</style>
</head>
<body>
<div class="page">
  <h1 class="dash-title">Dashboard</h1>

  <div class="bento">

    <!-- 01 Main — big tile -->
    <a class="tile big" href="main.html" style="--accent:#6BE3A4">
      <span class="tile-num">·01</span>
      <span class="tile-emoji">🏠</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Main</div>
      <div class="tile-footer">
        <span class="tile-sub">Goals &amp; daily plan</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <!-- 02 Fitness — wide tile -->
    <a class="tile wide" href="gym.html" style="--accent:#7DD3FC">
      <span class="tile-num">·02</span>
      <span class="tile-emoji">💪</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Fitness</div>
      <div class="tile-footer">
        <span class="tile-sub">Workouts, splits, sessions</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <!-- 03 Health — small tile -->
    <a class="tile" href="health.html" style="--accent:#A7F3D0">
      <span class="tile-num">·03</span>
      <span class="tile-emoji">💊</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Health</div>
      <div class="tile-footer">
        <span class="tile-sub">Supplements &amp; vitals</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <!-- 04 Water — small tile -->
    <a class="tile" href="po-water.html" style="--accent:#60A5FA">
      <span class="tile-num">·04</span>
      <span class="tile-emoji">💧</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Water</div>
      <div class="tile-footer">
        <span class="tile-sub">Hydration</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <!-- 05 Finance — wide tile -->
    <a class="tile wide" href="finance.html" style="--accent:#F2C063">
      <span class="tile-num">·05</span>
      <span class="tile-emoji">📊</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Finance</div>
      <div class="tile-footer">
        <span class="tile-sub">Net worth &amp; spending</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

  </div>
</div>
</body>
</html>
